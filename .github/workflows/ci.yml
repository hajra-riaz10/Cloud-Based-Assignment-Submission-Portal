name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests and generate report
        run: pytest -v --junitxml=testreport.xml

      - name: Upload test report even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: testreport.xml
          if-no-files-found: warn

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: https://example-api.invalid

  docker-image:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t assignment-portal-api .

  deliver-report:
    name: Deliver report to local PC
    runs-on: [self-hosted, Windows, X64]
    needs: backend-tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: test-report

      - name: Send JSON report to local receiver
        env:
          REPORT_RECEIVER_TOKEN: ${{ secrets.REPORT_RECEIVER_TOKEN }}
        run: python scripts/send_test_report.py
        
  email-report:
    name: Email test report
    runs-on: ubuntu-latest
    needs: backend-tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: test-report
          if-no-files-found: warn

      - name: Read test counts
        id: counts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import os

          files = ["test-report/testreport.xml"]
          total = passed = failed = 0

          try:
              root = ET.parse(files[0]).getroot()
              total = int(root.attrib.get("tests", 0))
              failed = int(root.attrib.get("failures", 0)) + int(root.attrib.get("errors", 0))
              skipped = int(root.attrib.get("skipped", 0))
              passed = total - failed - skipped
          except Exception:
              skipped = 0

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total={total}\n")
              f.write(f"passed={passed}\n")
              f.write(f"failed={failed}\n")
          PY

      - name: Send report by email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Test Report - ${{ needs.backend-tests.result }} - ${{ github.sha }}"
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Assignment Portal - Automated Test Report

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Overall result: ${{ needs.backend-tests.result }}

            Total tests: ${{ steps.counts.outputs.total }}
            Passed tests: ${{ steps.counts.outputs.passed }}
            Failed tests: ${{ steps.counts.outputs.failed }}

            Detailed test results are attached as an XML report.
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: test-report/testreport.xml
