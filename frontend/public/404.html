
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      const segmentCount = 1;
      const locationParts = window.location.pathname.split('/');
      const base = '/' + locationParts.slice(1, 1 + segmentCount).join('/');
      const route = locationParts.slice(1 + segmentCount).join('/');
      const query = window.location.search;
      const hash = window.location.hash;

      sessionStorage.setItem('spa-route', '/' + route + query + hash);
      window.location.replace(base + '/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
